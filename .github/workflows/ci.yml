name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  data-pipeline:
    name: Data → models pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analysis stack
        run: pip install -r scripts/requirements.txt
      - name: Clean data
        run: python scripts/prep_hyderabad.py
      - name: Train models and export artifacts
        run: python scripts/train_export_hyderabad.py
      - name: Regenerate report figures
        run: python scripts/make_figures_hyderabad.py

  web-build:
    name: Web app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
